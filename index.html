<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolokalizacja</title>
</head>
<body>


    <p id="wynik"></p>

    <script>

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(pozycja) {
                    let szerokosc = pozycja.coords.latitude;
                    let dlugosc = pozycja.coords.longitude;
                    document.getElementById("wynik").innerHTML =
                        "Szerokość geograficzna: " + szerokosc +
                        "<br>Długość geograficzna: " + dlugosc +
                        "<br>Dokładność: " + pozycja.coords.accuracy + " m";
                },

                function() {
                    document.getElementById("wynik").innerHTML =
                        "Nie udało się pobrać lokalizacji!";
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0
                }
            );

        } else {
            document.getElementById("wynik").innerHTML =
                "Przeglądarka nie obsługuje geolokalizacji.";
        }

    </script>

</body>
</html>
