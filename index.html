<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolokalizacja</title>
</head>
<body>

    <h2>Geolokalizacja</h2>
    <p id="wynik"></p>

    <h2>Device Orientation</h2>
    <p id="orientacja"></p>

    <h2>Device Motion</h2>
    <p id="ruch"></p>

    <button onclick="wibruj()">Wibracja</button>

    <script>

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(pozycja) {
                    let szerokosc = pozycja.coords.latitude;
                    let dlugosc = pozycja.coords.longitude;
                    document.getElementById("wynik").innerHTML =
                        "Szerokość geograficzna: " + szerokosc +
                        "<br>Długość geograficzna: " + dlugosc;
                },

                function() {
                    document.getElementById("wynik").innerHTML =
                        "Nie udało się pobrać lokalizacji!";
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0
                }
            );

        } else {
            document.getElementById("wynik").innerHTML =
                "Przeglądarka nie obsługuje geolokalizacji.";
        }

        window.addEventListener("deviceorientation", function(event) {

            let alpha = event.alpha;
            let beta = event.beta;
            let gamma = event.gamma;

            document.getElementById("orientacja").innerHTML =
                "Alpha: " + alpha?.toFixed(2) +
                "<br>Beta: " + beta?.toFixed(2) +
                "<br>Gamma: " + gamma?.toFixed(2);

        });

        window.addEventListener("devicemotion", (event) => {
            let x = event.accelerationIncludingGravity.x;
            let y = event.accelerationIncludingGravity.y;
            let z = event.accelerationIncludingGravity.z;

            document.getElementById("ruch").innerHTML =
                "X: " + x?.toFixed(2) +
                "<br>Y: " + y?.toFixed(2) +
                "<br>Z: " + z?.toFixed(2);
        });

        function wibruj() {
            navigator.vibrate(1000);
        }
    </script>

</body>
</html>
